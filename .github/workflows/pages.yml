name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Yandex Tiles configuration
        env:
          VITE_YANDEX_TILES_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
        run: |
          if [ -z "${VITE_YANDEX_TILES_API_KEY//[[:space:]]/}" ]; then
            echo "::error::Add the Tiles API key as YANDEX_MAPS_API_KEY in Settings > Secrets and variables > Actions before publishing."
            exit 1
          fi
      - run: npm ci
      - name: Verify Yandex Tiles access
        continue-on-error: true
        env:
          VITE_YANDEX_TILES_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
        run: node --use-env-proxy scripts/check-yandex-tiles.mjs
      - run: npm run build
        env:
          BASE_PATH: /
          VITE_YANDEX_TILES_API_KEY: ${{ secrets.YANDEX_MAPS_API_KEY }}
      - name: Validate Yandex Constructor import
        run: |
          python3 - <<'PY'
          import collections
          import json
          import xml.etree.ElementTree as ET
          ns = {"k": "http://www.opengis.net/kml/2.2"}
          items = ET.parse("dist/clubs-moskovsky.kml").findall(".//k:Placemark", ns)
          source = json.load(open("src/geocoded-places.json", encoding="utf-8"))
          actual = []
          for item in items:
              assert item.findtext("k:name", namespaces=ns)
              lon, lat, altitude = map(float, item.findtext("k:Point/k:coordinates", namespaces=ns).split(","))
              assert 30.17 < lon < 30.46 and 59.77 < lat < 59.94
              actual.append((lat, lon))
          expected = [tuple(item["coordinates"]) for item in source.values()]
          assert collections.Counter(actual) == collections.Counter(expected)
          print("Valid KML import:", len(items), "clubs; coordinates match the site")
          PY
      - name: Verify standalone map widget
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROMIUM_PATH="$(command -v google-chrome)"
          else
            npx playwright install --with-deps chromium
            export CHROMIUM_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")"
          fi
          npx playwright test tests/embed-map.spec.ts --project=desktop --project=mobile --workers=1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
